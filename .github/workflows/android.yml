name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Write keystore and signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > hapticogg-release.jks
          {
            echo "storeFile=hapticogg-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
          for abi in arm64-v8a armeabi-v7a universal; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            echo "::group::$apk"
            ls -lh "$apk"
            "$APKSIGNER" verify --print-certs "$apk"
            echo "::endgroup::"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hapticogg-release-apks
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-universal-release.apk

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: hapticogg-release-apks
          path: apks

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "apks/app-arm64-v8a-release.apk#arm64-v8a" \
            "apks/app-armeabi-v7a-release.apk#armeabi-v7a" \
            "apks/app-universal-release.apk#universal"
