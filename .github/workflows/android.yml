name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布到哪个 tag（留空则只构建、不创建 Release）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Write keystore and signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少 repository secret: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > hapticogg-release.jks
          {
            echo "storeFile=hapticogg-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # splits 已按 ABI 拆分：assembleRelease 一次产出 universal + 各 ABI 的 APK。
      - name: Assemble release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 先列出真实产物再归集，命名不符时直接告诉你是哪些文件，不用靠猜。
      - name: Collect APKs
        run: |
          set -euo pipefail
          echo "构建产物："
          find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -printf '%f\t%s bytes\n' | sort
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a universal; do
            src="app/build/outputs/apk/release/app-$abi-release.apk"
            if [ ! -f "$src" ]; then
              echo "::error::$src 不存在：请确认 app/build.gradle.kts 里的 splits.abi 已提交并推送到本次运行的提交"
              exit 1
            fi
            cp "$src" "dist/app-$abi-release.apk"
          done
          {
            echo "### 本次构建产物"
            echo ""
            echo "| 文件 | 大小 |"
            echo "| --- | --- |"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify signatures
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in dist/*.apk; do
            echo "::group::$apk"
            ls -lh "$apk"
            "$APKSIGNER" verify --print-certs "$apk"
            echo "::endgroup::"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hapticogg-release-apks
          if-no-files-found: error
          retention-days: 30
          path: dist/*.apk

      # 手动触发又没填 release_tag 时，把"为什么没有 Release"写进运行摘要，而不是静默跳过。
      - name: Explain skipped publish
        if: github.ref_type != 'tag' && inputs.release_tag == ''
        run: echo "本次为手动触发且未填 release_tag：只构建、不发布。要产出 Release，请推送 v* tag，或再次手动触发并填写 release_tag。" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   
          
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: hapticogg-release-apks
          path: apks

      # 用 runner 自带的 gh CLI 配合自动注入的 github.token：不需要 PAT，也不引入第三方 action。
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG="$GITHUB_REF_NAME"; fi
          echo "发布 tag：$TAG（commit $GITHUB_SHA）"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release 已存在，覆盖上传资产"
            gh release upload "$TAG" apks/*.apk --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              "apks/app-arm64-v8a-release.apk#arm64-v8a" \
              "apks/app-armeabi-v7a-release.apk#armeabi-v7a" \
              "apks/app-universal-release.apk#universal"
          fi
          gh release view "$TAG" | head -n 6
